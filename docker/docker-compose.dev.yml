services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    restart: unless-stopped
    privileged: true
    env_file:
      - ./.env/.env.dev
    volumes:
      - "./db/mysql/conf:/etc/mysql/conf.d"
      - "./db/mysql/data:/var/lib/mysql"
      - "./db/mysql/init:/docker-entrypoint-initdb.d"
    networks:
      - beisi-shared-network

  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile.dev
    container_name: caddy
    ports:
      - "8524:8524" # web_b2b项目
    env_file:
      - ./.env/.env.dev
    volumes:
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile
    networks:
      - beisi-shared-network
    restart: unless-stopped
    depends_on:
      - web-b2b-backend
      - web-b2b-frontend

  web-b2b-backend:
    build:
      context: ../server
      dockerfile: Dockerfile
    env_file:
      - ./.env/.env.dev
    volumes:
      - ../server/upload:/app/upload
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - beisi-shared-network
    depends_on:
      - mysql

  web-b2b-frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_DJANGO_BASE_URL: ${NEXT_PUBLIC_DJANGO_BASE_URL}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH}
        NEXT_PUBLIC_IMAGE_DOMAINS: ${NEXT_PUBLIC_IMAGE_DOMAINS}
        NEXT_PUBLIC_TEMPLATE_ID: ${NEXT_PUBLIC_TEMPLATE_ID}
    env_file:
      - ./.env/.env.dev
    expose:
      - "80"
    restart: unless-stopped
    networks:
      - beisi-shared-network

networks:
  beisi-shared-network:
    driver: bridge
