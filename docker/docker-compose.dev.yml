services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    ports:
      - "3306:3306"
    restart: always
    privileged: true
    environment:
      MYSQL_ROOT_PASSWORD: F29A99E8-4E64-4728-813A-3725EDBAF376
    volumes:
      - "./db/mysql/conf:/etc/mysql/conf.d"
      - "./db/mysql/data:/var/lib/mysql"
      - "./db/mysql/init:/docker-entrypoint-initdb.d"
    networks:
      - beisi-network
  caddy:
    build:
      context: ./caddy
      dockerfile: Dockerfile.dev
    container_name: caddy
    ports:
      - "8524:8524" # web_b2b项目
    volumes:
      - ./caddy/data:/data
      - ./caddy/config:/config
      - ./caddy/Caddyfile.dev:/etc/caddy/Caddyfile
    networks:
      - beisi-network
    restart: always

  web-b2b-backend:
    build:
      context: ../server
      dockerfile: Dockerfile

  web-b2b-frontend:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_URL: ${NEXT_PUBLIC_BASE_URL}
        NEXT_PUBLIC_DJANGO_BASE_URL: ${NEXT_PUBLIC_DJANGO_BASE_URL}
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH}
        NEXT_PUBLIC_IMAGE_DOMAINS: ${NEXT_PUBLIC_IMAGE_DOMAINS}
        NEXT_PUBLIC_TEMPLATE_ID: ${NEXT_PUBLIC_TEMPLATE_ID}
